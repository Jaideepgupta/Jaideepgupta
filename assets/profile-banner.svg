<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="t d">
<title id="t">Jaideep Gupta: Tableau Developer, Analytics &amp; Data Engineering</title>
<desc id="d">Animated data pipeline from sources through ingestion, bronze, silver and gold layers to Tableau and Power BI dashboards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/>
  </linearGradient>
  <radialGradient id="glow" cx="85%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.045"/>
  </pattern>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="952" y2="0">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="35%" stop-color="#cd7f32"/>
    <stop offset="55%" stop-color="#c9d1d9"/>
    <stop offset="75%" stop-color="#e3b341"/>
    <stop offset="100%" stop-color="#3ecf8e"/>
  </linearGradient>
  
</defs>
<rect width="1000" height="290" rx="16" fill="url(#bg)"/>
<rect width="1000" height="290" rx="16" fill="url(#dots)"/>
<rect width="1000" height="290" rx="16" fill="url(#glow)"/>
<rect x="0.75" y="0.75" width="998.5" height="288.5" rx="15.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="48" y="72" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b949e">Hi, I'm</text>
<text x="48" y="114" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#e6edf3">Jaideep Gupta</text>
<text x="48" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#3ecf8e">Tableau Developer <tspan fill="#8b949e">→</tspan> Analytics &amp; Data Engineering</text>
<text x="48" y="174" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8b949e">4+ years of BI · now building the pipelines that feed the dashboards.</text>

<rect x="684" y="46" width="268" height="32" rx="16" fill="#3ecf8e" fill-opacity="0.08" stroke="#3ecf8e" stroke-opacity="0.6"/>
<circle cx="704" cy="62" r="4.5" fill="#3ecf8e"/>
<circle cx="704" cy="62" r="4.5" fill="none" stroke="#3ecf8e">
  <animate attributeName="r" values="4.5;10" dur="1.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="718" y="67" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Open to Analytics / Data Eng roles</text>

<path id="bannerflow" d="M58.0,232.0 L942.0,232.0" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" fill="none"/>
<circle r="4" fill="#3ecf8e"><animateMotion dur="6.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#bannerflow" xlink:href="#bannerflow"/></animateMotion></circle>
<circle r="4" fill="#3ecf8e"><animateMotion dur="6.0s" begin="-2.00s" repeatCount="indefinite"><mpath href="#bannerflow" xlink:href="#bannerflow"/></animateMotion></circle>
