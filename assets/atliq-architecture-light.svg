<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">AtliQ Commerce architecture</title>
<desc id="d">Batch lane: Azure SQL to Azure Data Factory to Bronze on ADLS Gen2, Silver on Databricks, Gold in dbt, served in Power BI on Microsoft Fabric. Streaming lane: Kafka producer and topic to Structured Streaming bronze, silver and gold, operated by Airflow. CI with GitHub Actions gated on dbt tests.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f6f8fa"/>
  </linearGradient>
  <radialGradient id="glow" cx="85%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#1a7f37" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#000000" fill-opacity="0.05"/>
  </pattern>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="952" y2="0">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="35%" stop-color="#cd7f32"/>
    <stop offset="55%" stop-color="#c9d1d9"/>
    <stop offset="75%" stop-color="#e3b341"/>
    <stop offset="100%" stop-color="#1a7f37"/>
  </linearGradient>
  
</defs>
